{% extends "base.html" %}
{% block title %}Edit Student - {{ student.full_name }}{% endblock %}

{% block content %}
<div class="card shadow">
    <div class="card-header bg-primary text-white">
        <i class="fas fa-user-edit"></i> Edit Student Record
    </div>
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
            <div class="row">
                <div class="col-md-4 text-center">
                    <div class="mb-3">
                        <img src="{{ url_for('uploaded_file', filename=student.photo_path) if student.photo_path else url_for('static', filename='images/default_avatar.png') }}" 
                             class="rounded-circle mb-2" style="width: 150px; height: 150px; object-fit: cover; border: 3px solid #1a237e;">
                        <input type="file" name="photo" class="form-control mt-2" accept="image/*">
                        <small class="text-muted">Leave empty to keep current photo</small>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>Student ID</label>
                            <input type="text" class="form-control" value="{{ student.student_id }}" disabled>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Full Name *</label>
                            <input type="text" name="full_name" class="form-control" value="{{ student.full_name }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Class</label>
                            <input type="text" name="class" class="form-control" value="{{ student.class }}" required>
                        </div>
                       <div class="col-md-6 mb-3">
                            <label for="programme" class="form-label">
                                Programme
                            </label>
                        
                            <select
                                name="programme"
                                id="programme"
                                class="form-select"
                                required
                            >
                                <option value="">-- Select Programme --</option>
                        
                                <option
                                    value="USE"
                                    {% if student.programme == 'USE' %}selected{% endif %}
                                >
                                    USE
                                </option>
                        
                                <option
                                    value="Non-USE"
                                    {% if student.programme == 'Non-USE' %}selected{% endif %}
                                >
                                    Non-USE
                                </option>
                        
                                <option
                                    value="UPOLET"
                                    {% if student.programme == 'UPOLET' %}selected{% endif %}
                                >
                                    UPOLET
                                </option>
                        
                                <option
                                    value="Non-UPOLET"
                                    {% if student.programme == 'Non-UPOLET' %}selected{% endif %}
                                >
                                    Non-UPOLET
                                </option>
                            </select>
                        </div>
                        
                        <!-- Residence -->
                        <div class="col-md-6 mb-3">
                            <label for="residence" class="form-label">
                                Residence
                            </label>
                        
                            <select
                                name="residence"
                                id="residence"
                                class="form-select"
                                required
                            >
                                <option value="">-- Select Residence --</option>
                        
                                <option
                                    value="Day"
                                    {% if student.residence == 'Day' %}selected{% endif %}
                                >
                                    Day
                                </option>
                        
                                <option
                                    value="Boarding"
                                    {% if student.residence == 'Boarding' %}selected{% endif %}
                                >
                                    Boarding
                                </option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Parent Phone *</label>
                            <input type="text" name="parent_phone" class="form-control" value="{{ student.parent_phone or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Parent Email</label>
                            <input type="email" name="parent_email" class="form-control" value="{{ student.parent_email or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Address</label>
                            <input type="text" name="address" class="form-control" value="{{ student.address or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Admission Date</label>
                            <input type="date" name="admission_date" class="form-control" value="{{ student.admission_date or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Date of Birth</label>
                            <input type="date" name="date_of_birth" class="form-control" value="{{ student.date_of_birth or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Sex</label>
                            <select name="sex" class="form-select">
                                <option value="">Select</option>
                                <option value="Male" {% if student.sex == 'Male' %}selected{% endif %}>Male</option>
                                <option value="Female" {% if student.sex == 'Female' %}selected{% endif %}>Female</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Preferred House</label>
                            <input type="text" name="preferred_house" class="form-control" value="{{ student.preferred_house or '' }}">
                        </div>
                        <div class="col-md-12 mb-3">
                            <label>Disability (if any)</label>
                            <input type="text" name="disability" class="form-control" value="{{ student.disability or '' }}">
                        </div>
                    </div>
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary">Update Student</button>
                <a href="{{ url_for('teacher_students') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
