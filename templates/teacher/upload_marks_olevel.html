{% extends "base.html" %}
{% block title %}Upload O-Level Marks{% endblock %}
{% block content %}
<div class="card shadow">
    <div class="card-header bg-primary text-white">Upload O-Level Marks - Class {{ assigned_class }}</div>
    <div class="card-body">
        <div class="mb-3"><label>Select Class</label><select class="form-select" onchange="window.location.href='?class_name='+this.value">
            {% for cls in teacher_classes %}<option value="{{ cls.class_name }}" {% if cls.class_name == selected_class %}selected{% endif %}>{{ cls.class_name }}</option>{% endfor %}
        </select></div>
        <hr>
        <form method="POST" enctype="multipart/form-data">
            <div class="row"><div class="col-md-3"><label>Subject</label><input type="text" name="subject" class="form-control" required></div>
            <div class="col-md-2"><label>Term</label><input type="text" name="term" class="form-control" value="Term 1" required></div>
            <div class="col-md-2"><label>Year</label><input type="text" name="year" class="form-control" value="{{ current_year }}" required></div></div>
            <div class="mt-3"><label>Excel File (.xlsx)</label><input type="file" name="marks_file" class="form-control" accept=".xlsx, .xls" required>
            <small>Columns: student_id, ai1, ai2, ai3, ai4, ai5, ai6, eot_score, teacher_initials</small></div>
            <button type="submit" class="btn btn-primary mt-3">Upload Marks</button>
        </form>
    </div>
</div>
{% endblock %}
