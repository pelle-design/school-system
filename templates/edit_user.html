
{% extends "base.html" %}
{% block title %}Edit User{% endblock %}
{% block content %}
<div class="card shadow">
    <div class="card-header bg-primary text-white">Edit User</div>
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3"><label>Username</label><input type="text" name="username" class="form-control" value="{{ user[1] }}" required></div>
            <div class="mb-3"><label>Role</label><select name="role" class="form-select">
                <option>headteacher</option><option>admin</option><option>dos</option>
                <option>classteacher</option><option>subject_teacher</option><option>parent</option>
                <option>student</option><option>bursar</option><option>management</option>
            </select></div>
            <div class="mb-3"><label>Phone</label><input type="text" name="phone" class="form-control" value="{{ user[3] or '' }}"></div>
            <div class="mb-3"><label>Child ID</label><input type="text" name="child_id" class="form-control" value="{{ user[5] or '' }}"></div>
            <div class="mb-3"><label>Profile Picture</label><input type="file" name="profile_pic" class="form-control" accept="image/*">
                <small>Current: <img src="{{ url_for('uploaded_file', filename=user[6]) }}" width="40" class="rounded-circle"></small>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
