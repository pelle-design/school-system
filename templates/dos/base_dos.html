
{% extends "base.html" %}
{% block title %}Teacher Assignments{% endblock %}

{% block content %}
<style>
    .nav-tabs .nav-link {
        color: #1a237e;
        font-weight: bold;
    }
    .nav-tabs .nav-link.active {
        background-color: #1a237e;
        color: white;
        border-color: #1a237e;
    }
    .multi-class-badge {
        background-color: #ff9800;
        color: white;
        padding: 2px 6px;
        border-radius: 10px;
        font-size: 10px;
        margin-left: 5px;
    }
    .teacher-card {
        transition: transform 0.2s;
    }
    .teacher-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
</style>

        <!-- Notification Bar - Add to top of dos dashboard -->
        <div class="notification-bar no-print" style="background: #fff3cd; border-left: 4px solid #ffc107; padding: 10px 15px; margin-bottom: 20px; border-radius: 5px;">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <i class="fas fa-bell text-warning"></i>
                    <strong>Notifications:</strong>
                    <span id="notificationMessage">Loading...</span>
                </div>
                <div>
                    <span class="badge bg-danger" id="notificationCount">0</span>
                    <button onclick="markAllRead()" class="btn btn-sm btn-link">Mark all read</button>
                    <button onclick="refreshNotifications()" class="btn btn-sm btn-link"><i class="fas fa-sync-alt"></i></button>
                </div>
            </div>
            <div id="notificationList" style="max-height: 200px; overflow-y: auto; display: none; margin-top: 10px;">
                <!-- Notifications will load here -->
            </div>
        </div>

<script>
function loadNotifications() {
    fetch('/dos/get_notifications')
        .then(response => response.json())
        .then(data => {
            const unread = data.filter(n => !n.is_read);
            document.getElementById('notificationCount').innerText = unread.length;
            if (unread.length > 0) {
                document.getElementById('notificationMessage').innerHTML = `You have ${unread.length} new notification(s)`;
            } else {
                document.getElementById('notificationMessage').innerHTML = 'No new notifications';
            }
            
            const listHtml = data.map(n => `
                <div class="notification-item ${!n.is_read ? 'bg-light' : ''}" style="padding: 8px; border-bottom: 1px solid #eee;">
                    <strong>${n.title}</strong>
                    <p style="margin: 0; font-size: 12px;">${n.message}</p>
                    <small>${n.created_at}</small>
                </div>
            `).join('');
            document.getElementById('notificationList').innerHTML = listHtml;
        });
}

function toggleNotifications() {
    const list = document.getElementById('notificationList');
    list.style.display = list.style.display === 'none' ? 'block' : 'none';
}

function markAllRead() {
    fetch('/dos/mark_notifications_read', {method: 'POST'})
        .then(() => loadNotifications());
}

setInterval(loadNotifications, 30000);
loadNotifications();
</script>
{% endblock %}
