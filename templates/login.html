<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; border-radius: 24px; padding: 2rem; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .login-card h3 { font-weight: 700; }
        .btn-login { background: #667eea; border: none; border-radius: 12px; padding: 12px; font-weight: 600; width: 100%; }
        .btn-login:hover { background: #5a67d8; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="text-center mb-4">
        <i class="fas fa-school fa-3x text-primary mb-3"></i>
        <h3>School Management System</h3>
        <p class="text-muted">Login with your credentials</p>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
            <div class="alert alert-{{ cat }} alert-dismissible fade show">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
        {% endfor %}
    {% endwith %}
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="text" name="username" class="form-control mb-3" placeholder="Username" required>
        <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>
        <button type="submit" class="btn btn-primary btn-login">Login</button>
    </form>
    <div class="text-center mt-3"><a href="{{ url_for('forgot_password') }}">Forgot Password?</a></div>
</div>
</body>
</html>
