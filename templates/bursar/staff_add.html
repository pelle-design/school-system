{% extends "base.html" %}
{% block title %}Add Staff{% endblock %}
{% block content %}
<div class="card shadow">
    <div class="card-header bg-primary text-white">Add New Staff Member</div>
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3"><label>Full Name *</label><input type="text" name="full_name" class="form-control" required></div>
                <div class="col-md-6 mb-3"><label>Position *</label><input type="text" name="position" class="form-control" required></div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3"><label>Department</label><input type="text" name="department" class="form-control"></div>
                <div class="col-md-6 mb-3"><label>Phone</label><input type="text" name="phone" class="form-control" placeholder="0712345678"></div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3"><label>Email</label><input type="email" name="email" class="form-control"></div>
                <div class="col-md-6 mb-3"><label>NSSF Number</label><input type="text" name="nssf_number" class="form-control" placeholder="e.g., NSSF-12345"></div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3"><label>TIN Number</label><input type="text" name="tin_number" class="form-control" placeholder="e.g., TIN-123456789"></div>
                <div class="col-md-6 mb-3"><label>Bank Account</label><input type="text" name="bank_account" class="form-control"></div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3"><label>Bank Name</label><input type="text" name="bank_name" class="form-control"></div>
            </div>
            <hr>
            <h5>Salary Details</h5>
            <div class="row">
                <div class="col-md-4 mb-3"><label>Basic Salary</label><input type="number" name="salary_basic" class="form-control" step="0.01" value="0"></div>
                <div class="col-md-4 mb-3"><label>Allowances</label><input type="number" name="salary_allowances" class="form-control" step="0.01" value="0"></div>
                <div class="col-md-4 mb-3"><label>Deductions (Other)</label><input type="number" name="salary_deductions" class="form-control" step="0.01" value="0"></div>
            </div>
            <button type="submit" class="btn btn-primary">Save Staff</button>
            <a href="{{ url_for('bursar_staff') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
