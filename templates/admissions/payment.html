<!DOCTYPE html>
<html>
<head>
    <title>Admission Fee Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow mt-5">
                <div class="card-header bg-primary text-white text-center">
                    <h4>Admission Fee Payment</h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <strong>Student:</strong> {{ student_name }}<br>
                        <strong>Amount:</strong> UGX {{ "{:,.2f}".format(amount) }}
                    </div>
                    <form method="POST">
                        <div class="mb-3">
                            <label>Mobile Money Phone Number</label>
                            <input type="tel" name="phone_number" class="form-control" placeholder="0712345678" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Pay Now</button>
                    </form>
                    <p class="text-muted mt-3 small">* Payment will be processed via mobile money. A confirmation will be sent to your phone.</p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
