<!DOCTYPE html>
<html>
<head>
    <title>Student Admission Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .form-card { background: white; border-radius: 20px; padding: 30px; margin: 30px auto; max-width: 800px; }
        .form-title { text-align: center; margin-bottom: 30px; }
    </style>
</head>
<body>
<div class="container">
    <div class="form-card">
        <div class="form-title">
            <h2>Student Admission Application</h2>
            <p>Please fill in all required information</p>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
                <div class="alert alert-{{ cat }}">{{ msg }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST" enctype="multipart/form-data">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Full Name *</label>
                    <input type="text" name="full_name" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Date of Birth *</label>
                    <input type="date" name="date_of_birth" class="form-control" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Sex *</label>
                    <select name="sex" class="form-select" required>
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Preferred House *</label>
                    <select name="preferred_house" class="form-select" required>
                        <option value="">Select</option>
                        {% for h in houses %}
                        <option value="{{ h.name }}">{{ h.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>LIN (Learner Identification Number) *</label>
                    <input type="text" name="lin" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Disability (if any)</label>
                    <input type="text" name="disability" class="form-control" placeholder="e.g., None, Visual impairment, etc.">
                </div>
            </div>
            <div class="mb-3">
                <label>Sports Activities</label>
                <select name="sports_activities" multiple class="form-select" size="5">
                    {% for s in sports %}
                    <option value="{{ s.name }}">{{ s.name }}</option>
                    {% endfor %}
                </select>
                <small class="text-muted">Hold Ctrl to select multiple</small>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Phone Number *</label>
                    <input type="tel" name="phone" class="form-control" placeholder="0712345678" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Email Address *</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Passport Photo *</label>
                    <input type="file" name="photo" class="form-control" accept="image/*" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Previous Results (PDF) *</label>
                    <input type="file" name="results_pdf" class="form-control" accept=".pdf" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Submit Application</button>
        </form>
    </div>
</div>
</body>
</html>
