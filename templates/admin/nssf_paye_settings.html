{% extends "base.html" %}
{% block title %}NSSF & PAYE Settings{% endblock %}
{% block content %}
<div class="card shadow">
    <div class="card-header bg-primary text-white">
        <i class="fas fa-chart-line"></i> NSSF & PAYE Tax Settings
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label>NSSF Employee Rate (%)</label>
                    <input type="number" name="nssf_employee_rate" class="form-control" step="0.01" value="{{ settings[0] if settings else 5.0 }}" required>
                    <small class="text-muted">Percentage deducted from employee's gross salary</small>
                </div>
                <div class="col-md-4 mb-3">
                    <label>PAYE Tax Rate (%)</label>
                    <input type="number" name="paye_rate" class="form-control" step="0.01" value="{{ settings[1] if settings else 10.0 }}" required>
                    <small class="text-muted">Percentage applied to taxable income</small>
                </div>
                <div class="col-md-4 mb-3">
                    <label>PAYE Tax Threshold (UGX)</label>
                    <input type="number" name="paye_threshold" class="form-control" step="0.01" value="{{ settings[2] if settings else 235000 }}" required>
                    <small class="text-muted">Income below this amount is not taxed</small>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Save Settings</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
