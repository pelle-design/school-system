{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">Reset Password</div>
            <div class="card-body">
                <p class="text-muted">Enter your username and registered phone number.</p>
                <form method="POST">
                    <div class="mb-3"><label>Username</label><input type="text" name="username" class="form-control" required></div>
                    <div class="mb-3"><label>Phone Number</label><input type="text" name="phone" class="form-control" placeholder="0712345678" required></div>
                    <div class="mb-3"><label>New Password</label><input type="password" name="new_password" class="form-control" required></div>
                    <div class="mb-3"><label>Confirm Password</label><input type="password" name="confirm_password" class="form-control" required></div>
                    <button type="submit" class="btn btn-primary">Reset Password</button>
                    <a href="{{ url_for('login') }}" class="btn btn-secondary">Back to Login</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
